[project]
name = "aicol"
version = "0.1.0"
description = "Reference worker and installer for ai-db derived columns on PostgreSQL"
authors = [
    { name = "Simone Salerno", email = "doppiaesse@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=3.19.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
aicol = "aicol.cli:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["llm: calls a real model provider, excluded by default"]
addopts = "-m 'not llm'"
